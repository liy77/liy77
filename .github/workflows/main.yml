name: Refresh profile

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mikasa-commits:
    name: Refresh Mikasa commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite the latest-commits block
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import json, os, re, urllib.request

          req = urllib.request.Request(
              "https://api.github.com/repos/liy77/mikasa/commits?per_page=20&sha=master",
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "liy77-profile",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as res:
              commits = json.load(res)

          rows = []
          for commit in commits:
              if commit["commit"]["message"].startswith("Merge "):
                  continue
              sha = commit["sha"]
              short = sha[:7]
              date = commit["commit"]["author"]["date"][:10]
              message = commit["commit"]["message"].split("\n", 1)[0]
              message = (
                  message.replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
              )
              url = f"https://github.com/liy77/mikasa/commit/{sha}"
              if len(rows) == 6:
                  break
              rows.append(
                  "<tr>"
                  f'<td width="92"><a href="{url}"><code>{short}</code></a></td>'
                  f'<td width="108"><sub>{date}</sub></td>'
                  f'<td><a href="{url}">{message}</a></td>'
                  "</tr>"
              )

          block = (
              "<!-- MIKASA-COMMITS:START -->\n"
              '<table width="100%">\n'
              + "\n".join(rows)
              + "\n</table>\n"
              "<!-- MIKASA-COMMITS:END -->"
          )

          path = "README.md"
          with open(path, encoding="utf-8") as handle:
              readme = handle.read()
          updated, count = re.subn(
              r"<!-- MIKASA-COMMITS:START -->.*?<!-- MIKASA-COMMITS:END -->",
              block,
              readme,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("Mikasa commits markers were not found in README.md")
          if updated == readme:
              print("Commits unchanged.")
          else:
              with open(path, "w", encoding="utf-8") as handle:
                  handle.write(updated)
              print("Commits refreshed.")
          PY

      - name: Commit when the list changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "liy77"
          git config user.email "73443391+liy77@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh latest Mikasa commits."
          git push
